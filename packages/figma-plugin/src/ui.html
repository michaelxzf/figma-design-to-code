<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design to Code</title>
    <style>
      :root {
        --bg: var(--figma-color-bg, #ffffff);
        --bg-soft: var(--figma-color-bg-secondary, #f5f5f5);
        --border: var(--figma-color-border, #e5e5e5);
        --text: var(--figma-color-text, #1a1a1a);
        --text-soft: var(--figma-color-text-secondary, #6b7280);
        --accent: var(--figma-color-bg-brand, #2563eb);
        --accent-text: var(--figma-color-text-onbrand, #ffffff);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 11px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header h1 { font-size: 12px; margin: 0; font-weight: 600; }
      #layer { color: var(--text-soft); margin-left: auto; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row { display: flex; gap: 6px; align-items: center; }
      select, button {
        font: inherit;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        padding: 5px 9px;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
      button:hover { border-color: var(--accent); }
      .toolbar { padding: 10px 16px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid var(--border); }
      .toolbar .spacer { flex: 1; }
      .tabs { display: flex; gap: 2px; padding: 8px 16px 0; }
      .tab { border: none; background: transparent; color: var(--text-soft); padding: 5px 10px; border-radius: 6px 6px 0 0; }
      .tab[aria-selected="true"] { background: var(--bg-soft); color: var(--text); font-weight: 600; }
      main { flex: 1; overflow: auto; padding: 0 16px 16px; }
      pre {
        margin: 0;
        padding: 12px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 0 6px 6px 6px;
        font: 11px/1.6 "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        white-space: pre;
        overflow: auto;
        min-height: 100%;
      }
      #status { padding: 24px 16px; color: var(--text-soft); text-align: center; }
      #status.error { color: var(--figma-color-text-danger, #b91c1c); }
      .hidden { display: none !important; }
      footer { padding: 8px 16px; border-top: 1px solid var(--border); color: var(--text-soft); display: flex; gap: 8px; align-items: center; }
    </style>
  </head>
  <body>
    <header>
      <h1>Design to Code</h1>
      <span id="layer"></span>
    </header>

    <div class="toolbar">
      <label for="target">Target</label>
      <select id="target"></select>
      <span class="spacer"></span>
      <button id="refresh" title="Re-read the current selection">Refresh</button>
      <button id="copy" class="primary">Copy code</button>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab" id="tab-code" aria-selected="true">Code</button>
      <button class="tab" id="tab-ir" aria-selected="false">Design IR</button>
    </div>

    <main>
      <p id="status">Select a frame in Figma to generate code.</p>
      <pre id="output" class="hidden"><code id="output-code"></code></pre>
    </main>

    <footer>
      <span id="filename"></span>
      <span class="spacer" style="flex:1"></span>
      <span>Runs offline - nothing is uploaded</span>
    </footer>

    <script>
      const state = { code: '', ir: '', tab: 'code', filename: '' };

      const el = {
        target: document.getElementById('target'),
        status: document.getElementById('status'),
        output: document.getElementById('output'),
        outputCode: document.getElementById('output-code'),
        layer: document.getElementById('layer'),
        filename: document.getElementById('filename'),
        tabCode: document.getElementById('tab-code'),
        tabIr: document.getElementById('tab-ir'),
      };

      function post(message) {
        parent.postMessage({ pluginMessage: message }, '*');
      }

      function render() {
        const hasCode = Boolean(state.code);
        el.output.classList.toggle('hidden', !hasCode);
        el.status.classList.toggle('hidden', hasCode);
        el.tabCode.setAttribute('aria-selected', String(state.tab === 'code'));
        el.tabIr.setAttribute('aria-selected', String(state.tab === 'ir'));
        // textContent (never innerHTML) keeps layer names and text content inert.
        el.outputCode.textContent = state.tab === 'code' ? state.code : state.ir;
        el.filename.textContent = state.tab === 'code' ? state.filename : 'design-ir.json';
      }

      function showStatus(message, isError) {
        state.code = '';
        state.ir = '';
        el.status.textContent = message;
        el.status.classList.toggle('error', Boolean(isError));
        el.layer.textContent = '';
        el.filename.textContent = '';
        render();
      }

      function copyCurrent() {
        const text = state.tab === 'code' ? state.code : state.ir;
        if (!text) return;
        const area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        let ok = false;
        try {
          ok = document.execCommand('copy');
        } catch (error) {
          ok = false;
        }
        area.remove();
        post({ type: 'toast', message: ok ? 'Copied to clipboard' : 'Copy failed - select the code manually' });
      }

      el.target.addEventListener('change', () => post({ type: 'set-target', target: el.target.value }));
      document.getElementById('refresh').addEventListener('click', () => post({ type: 'refresh' }));
      document.getElementById('copy').addEventListener('click', copyCurrent);
      el.tabCode.addEventListener('click', () => { state.tab = 'code'; render(); });
      el.tabIr.addEventListener('click', () => { state.tab = 'ir'; render(); });

      onmessage = (event) => {
        const msg = event.data && event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === 'init') {
          el.target.innerHTML = '';
          for (const target of msg.targets) {
            const option = document.createElement('option');
            option.value = target.id;
            option.textContent = target.label;
            el.target.appendChild(option);
          }
          el.target.value = msg.target;
          return;
        }
        if (msg.type === 'code') {
          state.code = msg.code;
          state.ir = msg.ir;
          state.filename = msg.filename;
          el.layer.textContent = msg.nodeName;
          render();
          return;
        }
        if (msg.type === 'empty') showStatus(msg.message, false);
        if (msg.type === 'error') showStatus('Codegen failed: ' + msg.message, true);
      };
    </script>
  </body>
</html>
